<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neska Music</title><style>html,body{margin:0;height:100%;background:#1a0f1f}#neskaIntro{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 90% at 50% 40%,#3a1a3f 0%,#1a0f1f 60%,#0d070f 100%);transition:opacity .55s ease,visibility .55s;font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif}
#neskaIntro.ni-out{opacity:0;visibility:hidden;pointer-events:none}
.ni-coin{position:relative;width:148px;height:148px;border-radius:50%;animation:niIn 1s cubic-bezier(.2,1.3,.4,1) both}
.ni-coin img{width:100%;height:100%;display:block;border-radius:50%;animation:niSpin 1.1s cubic-bezier(.3,.9,.3,1) both}
.ni-coin::before{content:"";position:absolute;inset:-28px;border-radius:50%;background:radial-gradient(circle,rgba(240,180,170,.55) 0%,rgba(200,120,170,.25) 40%,transparent 70%);animation:niGlow 2.2s ease-in-out .5s infinite;z-index:-1}
.ni-coin::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;mix-blend-mode:overlay;animation:niShine 1.6s ease-in-out .7s infinite}
.ni-name{color:#f6e3dc;font-size:26px;font-weight:700;letter-spacing:.5px;opacity:0;animation:niUp .6s ease .55s forwards}
.ni-name sup{font-size:.45em;vertical-align:super}
.ni-tag{color:#e7b7a6;font-size:12px;letter-spacing:6px;margin-top:-10px;opacity:0;animation:niUp .6s ease .75s forwards}
.ni-msg{color:#cdb3c4;font-size:14px;text-align:center;max-width:280px;line-height:1.4;min-height:20px}
.ni-btn{display:none;margin-top:4px;padding:11px 26px;border:1px solid rgba(240,190,175,.5);border-radius:999px;background:rgba(255,255,255,.08);color:#f6e3dc;font-size:15px;font-weight:600}
@keyframes niIn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes niSpin{0%{transform:rotateY(180deg)}100%{transform:rotateY(0)}}
@keyframes niGlow{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
@keyframes niShine{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
@keyframes niUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ni-coin,.ni-coin img,.ni-coin::before,.ni-coin::after,.ni-name,.ni-tag{animation:none!important;opacity:1}}
</style></head><body>
<div id="neskaIntro"><div class="ni-coin"><img src="neska-emblem.png" alt=""></div><div class="ni-name">Neska<sup>™</sup> Music</div><div class="ni-tag">GLOBAL SOUND</div>
<div class="ni-msg" id="msg">&nbsp;</div><button class="ni-btn" id="retry">Try again</button></div>
<script>
var HOME="https://shinesdags-bot.github.io/",busy=false;
function msg(t){document.getElementById("msg").textContent=t;}
function check(manual){if(busy)return;busy=true;if(manual)msg("Connecting…");
 fetch(HOME+"?ping="+Date.now(),{mode:"no-cors",cache:"no-store"}).then(function(){location.replace(HOME);})
 .catch(function(){busy=false;msg("You're offline. Neska will open by itself when you're back online.");document.getElementById("retry").style.display="inline-block";});}
document.getElementById("retry").onclick=function(){check(true);};
window.addEventListener("online",function(){check(true);});
setTimeout(function(){check(false);},1600);setInterval(function(){check(false);},5000);
</script></body></html>
