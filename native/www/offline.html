<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neska Music</title><style>html,body{margin:0;height:100%;background:#1a0f1f}#neskaIntro{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 90% at 50% 40%,#3a1a3f 0%,#1a0f1f 60%,#0d070f 100%);transition:opacity .55s ease,visibility .55s;font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif}

</style></head><body>
<div id="neskaIntro"><div class="ni-coin"><img src="neska-emblem.png" alt=""></div><div class="ni-name">Neska<sup>™</sup> Music</div><div class="ni-tag">GLOBAL SOUND</div>

<main id="app" aria-label="Offline songs">
  <div class="op-top">

  </div>

    <div class="op-ctl">
      <button class="op-sm" id="shuf" type="button" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="op-play" id="play" type="button" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <span style="width:52px" aria-hidden="true"></span>
    </div>
  </section>

<script>
/* Neska offline screen. Shown by the native app when the live site can't load.
   Plays the songs the site copied into the app's own storage (Filesystem, Directory.Data,
   neska-offline/manifest.json), with crossfade and lock-screen controls, and reopens
   the live site by itself once the internet is back (never in the middle of a song). */
var HOME="https://shinesdags-bot.github.io/",busy=false;
var C=window.Capacitor,NATIVE=!!(C&&C.isNativePlatform&&C.isNativePlatform()),PLAT=NATIVE&&C.getPlatform?C.getPlatform():"web";
var FS=NATIVE&&C.Plugins&&C.Plugins.Filesystem;
var songs=[],base="",order=[],pos=-1,shuffle=false,xfSec=6,online=false;
function $(id){return document.getElementById(id);}
function msg(t){$("msg").textContent=t;}
function isPlaying(){return !!(cur()&&!cur().paused&&songs.length);}
function goHome(){try{localStorage.setItem("neska.homeAt",String(Date.now()));}catch(e){}location.replace(HOME);}
function justTried(){try{return Date.now()-(+localStorage.getItem("neska.homeAt")||0)<45000;}catch(e){return false;}} // the site just failed to open: no auto loop
function check(manual){if(busy)return;busy=true;if(manual)msg("Connecting…");
 fetch(HOME+"?ping="+Date.now(),{mode:"no-cors",cache:"no-store"}).then(function(){busy=false;
   if(manual||(!isPlaying()&&!justTried())){goHome();return;}
   if(!isPlaying()){msg("You're online, but Neska didn't open. Tap Try again.");document.getElementById("retry").style.display="inline-block";}
   online=true;$("state").textContent="You're back online";$("retry2").textContent="Open Neska";})
 .catch(function(){busy=false;online=false;
   msg("You're offline. Neska will open by itself when you're back online.");document.getElementById("retry").style.display="inline-block";
   if(songs.length){$("state").textContent="You're offline · playing your saved songs";$("retry2").textContent="Try again";}});}
document.getElementById("retry").onclick=function(){check(true);};
$("retry2").onclick=function(){if(online)goHome();else check(true);};
window.addEventListener("online",function(){check(false);});
setTimeout(function(){check(false);},1600);setInterval(function(){check(false);},5000);

/* ---------- saved songs ---------- */
function fileSrc(uri){ // file:///… → this page's origin/_capacitor_file_/… (served by Capacitor, with byte ranges)
  var p=String(uri).replace(/^file:\/\//,"");
  if(/^(capacitor|https?):\/\/localhost$/.test(location.origin))return location.origin+"/_capacitor_file_"+p;
  return C&&C.convertFileSrc?C.convertFileSrc(uri):uri;
}
function loadSongs(){
  if(!FS||!FS.readFile)return Promise.resolve();
  return Promise.all([
    FS.getUri({path:"neska-offline",directory:"DATA"}),
    FS.readFile({path:"neska-offline/manifest.json",directory:"DATA",encoding:"utf8"})
  ]).then(function(r){
    var m=JSON.parse((r[1]&&r[1].data)||"null");
    if(!m||!Array.isArray(m.songs))return;
    base=fileSrc(r[0].uri).replace(/\/$/,"");
    if(typeof m.crossfade==="number")xfSec=Math.max(0,Math.min(12,m.crossfade));
    songs=m.songs.filter(function(s){return s&&s.file;});
  }).catch(function(){});
}
function url(f){return f?base+"/"+f.split("/").map(encodeURIComponent).join("/"):"";}
function art(s){return s&&s.cover?url(s.cover):"neska-emblem.png";}
function fmt(t){t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+":"+("0"+t%60).slice(-2);}
function buildList(){
  var ul=$("list");ul.innerHTML="";
  $("count").textContent="Saved offline · "+songs.length+(songs.length===1?" song":" songs");
  songs.forEach(function(s,i){
    var li=document.createElement("li"),b=document.createElement("button"),im=document.createElement("img"),sp=document.createElement("span"),t=document.createElement("b"),a=document.createElement("i");
    b.type="button";b.className="op-row";b.dataset.i=i;
    im.src=art(s);im.alt="";im.loading="lazy";im.onerror=function(){this.onerror=null;this.src="neska-emblem.png";};
    t.textContent=s.title||"Untitled";a.textContent=s.artist||"";
    sp.appendChild(t);sp.appendChild(a);b.appendChild(im);b.appendChild(sp);li.appendChild(b);ul.appendChild(li);
    b.onclick=function(){unlock();playIndex(i,true);};
  });
}
function mark(){
  var i=order[pos];
  [].forEach.call(document.querySelectorAll(".op-row"),function(b){var on=+b.dataset.i===i;b.classList.toggle("is-on",on);if(on)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current");});
}
function makeOrder(start){
  order=songs.map(function(_,i){return i;});
  if(shuffle){for(var k=order.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),x=order[k];order[k]=order[j];order[j]=x;}
    if(start>=0){order.splice(order.indexOf(start),1);order.unshift(start);}}
  pos=start>=0?order.indexOf(start):-1;
}

/* ---------- player: two <audio> elements, Web Audio gains for the crossfade ---------- */
var els=[mk(),mk()],act=0,ctx=null,gains=[null,null],fading=null,plain=false,stuckSince=0,an=null,heard=false,quiet=0,buf=null;
function mk(){var a=document.createElement("audio");a.preload="auto";a.setAttribute("playsinline","");a.setAttribute("webkit-playsinline","");document.body.appendChild(a);return a;}
function cur(){return els[act];}
function wire(a){
  a.addEventListener("timeupdate",function(){if(a===cur())tick();});
  a.addEventListener("ended",function(){if(a===cur()&&!fading)next(true);});
  a.addEventListener("play",function(){if(a===cur())state();});
  a.addEventListener("pause",function(){if(a===cur())state();});
  a.addEventListener("loadedmetadata",function(){if(a===cur()){$("tDur").textContent=fmt(a.duration);pos_();}});
  a.addEventListener("error",function(){if(a===cur()&&a.getAttribute("src")){$("state").textContent="Couldn't play that song";setTimeout(function(){next(true);},800);}});
}
els.forEach(wire);
function unlock(){ // inside a tap: the moment iOS lets audio start
  try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}
  if(ctx||plain||!xfSec)return;
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC){plain=true;return;}
  try{ctx=new AC({latencyHint:"playback"});}catch(e){try{ctx=new AC();}catch(e2){ctx=null;plain=true;return;}}
  try{an=ctx.createAnalyser();an.fftSize=1024;an.connect(ctx.destination);buf=new Float32Array(an.fftSize);
    els.forEach(function(a,i){var s=ctx.createMediaElementSource(a),g=ctx.createGain();s.connect(g);g.connect(an);gains[i]=g;});}
  catch(e){toPlain();return;}
  resume();
}
function resume(){if(ctx&&ctx.state!=="running"){try{var p=ctx.resume();if(p&&p.catch)p.catch(function(){});}catch(e){}}}
document.addEventListener("visibilitychange",resume);
/* safety net: if the audio graph stops (an iOS interruption), carry on with plain elements, no fades */
function toPlain(){
  var old=els,o=old[act],t=o.currentTime||0,src=o.getAttribute("src"),was=!o.paused;
  old.forEach(function(a){try{a.pause();}catch(e){}a.removeAttribute("src");a.load();a.remove();});
  try{if(ctx)ctx.close();}catch(e){}
  ctx=null;gains=[null,null];an=null;plain=true;fading=null;els=[mk(),mk()];act=0;els.forEach(wire);
  if(src){var a=els[0];a.src=src;a.addEventListener("loadedmetadata",function f(){a.removeEventListener("loadedmetadata",f);try{a.currentTime=t;}catch(e){}},false);if(was)go(a);}
}
function go(a){try{var p=a.play();if(p&&p.catch)p.catch(function(){state();});}catch(e){}}
function setGain(i,v){var g=gains[i];if(!g)return;try{g.gain.cancelScheduledValues(ctx.currentTime);g.gain.setValueAtTime(v,ctx.currentTime);}catch(e){g.gain.value=v;}}
function stopFade(){
  if(!fading)return;
  var o=fading.old;clearTimeout(fading.timer);fading=null;
  try{o.pause();}catch(e){}
  setGain(els.indexOf(o),1);setGain(act,1);
}
function load(a,s){var u=url(s.file);if(a.getAttribute("src")!==u){a.src=u;a.load();}a.dataset.sid=s.id;}
function playIndex(i,user){
  if(!songs[i])return;
  stopFade();
  if(user||order.indexOf(i)<0)makeOrder(i);else pos=order.indexOf(i);
  var a=cur(),o=els[1-act];try{o.pause();}catch(e){}
  setGain(act,1);
  if(a.dataset.sid!==songs[i].id)load(a,songs[i]);else try{a.currentTime=0;}catch(e){}
  go(a);show();
  preloadNext();
}
function peek(){if(!order.length)return -1;var p=pos+1;if(p>=order.length)p=0;return order[p]===order[pos]&&order.length===1?-1:order[p];}
function preloadNext(){var n=peek(),o=els[1-act];if(n>=0&&!fading&&o.dataset.sid!==songs[n].id){load(o,songs[n]);}}
function next(auto){
  if(!songs.length)return;
  if(pos<0){playIndex(order.length?order[0]:0);return;}
  stopFade();
  var p=pos+1;if(p>=order.length){p=0;if(shuffle)makeOrder(-1);}
  pos=p;var i=order[pos],o=els[1-act];
  try{cur().pause();}catch(e){}
  if(o.dataset.sid===songs[i].id){act=1-act;try{cur().currentTime=0;}catch(e){}}else load(cur(),songs[i]);
  setGain(act,1);go(cur());show();preloadNext();
}
function prev(){
  if(!songs.length)return;
  var a=cur();if(pos<0||a.currentTime>3||order.length<2){try{a.currentTime=0;}catch(e){}return;}
  stopFade();
  pos=pos<=0?order.length-1:pos-1;var i=order[pos];
  try{a.pause();}catch(e){}load(a,songs[i]);setGain(act,1);go(a);show();preloadNext();
}
function toggle(){
  unlock();
  if(!songs.length)return;
  if(pos<0){makeOrder(shuffle?Math.floor(Math.random()*songs.length):0);playIndex(order[0]);return;}
  var a=cur();if(a.paused){resume();go(a);if(fading)go(fading.old);}else{a.pause();if(fading)stopFade();}
}
/* near a song's end: the next one starts under it and the two cross with equal-power curves */
function curve(up){var n=64,c=new Float32Array(n);for(var k=0;k<n;k++){var x=k/(n-1);c[k]=up?Math.sin(x*Math.PI/2):Math.cos(x*Math.PI/2);}return c;}
function tick(){
  var a=cur(),d=a.duration;
  $("tCur").textContent=fmt(a.currentTime);
  if(!$("seek").dragging&&isFinite(d)&&d>0)$("seek").value=Math.round(a.currentTime/d*1000);
  if(ctx&&!a.paused){
    if(ctx.state!=="running"){resume();if(!stuckSince)stuckSince=Date.now();else if(Date.now()-stuckSince>2500){stuckSince=0;toPlain();return;}}else stuckSince=0;
    // the graph runs but nothing comes through it (a WebView that won't route the file): plain playback instead
    if(!heard&&an&&ctx.state==="running"&&a.currentTime>1&&!document.hidden){
      var mx=0;try{an.getFloatTimeDomainData(buf);for(var k=0;k<buf.length;k++){var v=Math.abs(buf[k]);if(v>mx)mx=v;}}catch(e){mx=1;}
      if(mx>0.0005)heard=true;else if(++quiet>20){quiet=0;toPlain();return;}
    }
  }
  if(!ctx||plain||fading||!xfSec||a.paused||!isFinite(d))return;
  var left=d-a.currentTime;
  if(d<2*xfSec+2||left>xfSec)return;
  var n=peek();if(n<0)return;
  var o=els[1-act],oi=1-act,ai=act,len=Math.max(1,Math.min(xfSec,left));
  if(o.dataset.sid!==songs[n].id)load(o,songs[n]);
  try{o.currentTime=0;}catch(e){}
  var t=ctx.currentTime;
  try{gains[oi].gain.cancelScheduledValues(t);gains[oi].gain.setValueAtTime(0,t);gains[oi].gain.setValueCurveAtTime(curve(true),t+0.02,len);
      gains[ai].gain.cancelScheduledValues(t);gains[ai].gain.setValueCurveAtTime(curve(false),t+0.02,len);}catch(e){return;}
  go(o);
  fading={old:a,timer:setTimeout(function(){if(fading&&fading.old===a){fading=null;try{a.pause();}catch(e){}setGain(ai,1);}},len*1000+600)};
  a.addEventListener("ended",function f(){a.removeEventListener("ended",f);if(fading&&fading.old===a){clearTimeout(fading.timer);fading=null;setGain(ai,1);}});
  act=oi;pos=order.indexOf(n);show();
  setTimeout(preloadNext,len*1000+900);
}
$("play").onclick=toggle;$("next").onclick=function(){unlock();next(false);};$("prev").onclick=function(){unlock();prev();};
$("shuf").onclick=function(){shuffle=!shuffle;this.setAttribute("aria-pressed",String(shuffle));var i=pos>=0?order[pos]:-1;makeOrder(i);if(i<0)pos=-1;preloadNext();};
(function(){var s=$("seek");s.addEventListener("input",function(){s.dragging=true;var a=cur();if(isFinite(a.duration))$("tCur").textContent=fmt(s.value/1000*a.duration);});
 s.addEventListener("change",function(){s.dragging=false;var a=cur();stopFade();if(isFinite(a.duration)){try{a.currentTime=s.value/1000*a.duration;}catch(e){}}pos_();});})();

/* ---------- now playing: screen, lock screen ---------- */
var MSP=NATIVE&&PLAT==="android"&&C.Plugins&&C.Plugins.MediaSession,artData={};
function q(f){try{var r=f();if(r&&r.catch)r.catch(function(){});}catch(e){}}
function state(){
