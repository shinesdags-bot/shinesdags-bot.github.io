name: Neska Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/neska-android.yml"]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install and sync
        working-directory: native
        run: npm ci && npx cap sync android
      - name: Build release APK (unsigned)
        working-directory: native/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Align
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 native/android/app/build/outputs/apk/release/app-release-unsigned.apk neska-unsigned.apk
      - name: Publish unsigned build
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "android-unsigned-${{ github.run_number }}" neska-unsigned.apk --prerelease --title "Neska Android build ${{ github.run_number }} (unsigned)" --notes "Unsigned build, signed separately before sharing."
